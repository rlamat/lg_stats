{% extends 'base.html' %}
{% block content %}
  <h2 class="text-white">Ajouter une partie</h2>
  <form method="post" enctype="multipart/form-data" class="mt-3 text-white">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Enregistrer</button>
  </form>
  <script>
    (function(){
      function pad(n){ return String(n).padStart(2,'0'); }
      function setMax(){
        var input = document.getElementById('id_played_at');
        if(!input) return;
        var t = new Date(Date.now() + 10*60*1000); // maintenant + 10 min
        var s = t.getFullYear() + "-" + pad(t.getMonth()+1) + "-" + pad(t.getDate())
              + "T" + pad(t.getHours()) + ":" + pad(t.getMinutes());
        input.setAttribute('max', s);
      }
      setMax();
      setInterval(setMax, 60000);
    })();
    </script>  
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const won = document.getElementById('id_won');
        const camp = document.getElementById('id_camp');
        const winCamp = document.getElementById('id_winning_camp');
      
        function syncWinningCamp() {
          if (!won || !camp || !winCamp) return;
          if (won.checked) {
            winCamp.value = camp.value;
            winCamp.setAttribute('disabled', 'disabled');
            winCamp.title = "Dérivé automatiquement de votre camp (partie gagnée).";
          } else {
            winCamp.removeAttribute('disabled');
            winCamp.title = "";
          }
        }
      
        if (won) {
          won.addEventListener('change', syncWinningCamp);
        }
        if (camp) {
          camp.addEventListener('change', syncWinningCamp);
        }
        syncWinningCamp();
      });
      </script>        
{% endblock %}
