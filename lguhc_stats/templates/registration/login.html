{% extends 'base.html' %}
{% block content %}
  <h2 class="text-white">Connexion</h2>
  <form method="post" class="mt-3 text-white">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Se connecter</button>
  </form>
  <p class="mt-3"><a href="{% url 'password_reset' %}">Mot de passe oublié ?</a></p>
{% endblock %}
